<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>{{ traducoes('site_header') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/estilo.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <header>
        <div class="navbar">
            <div class="logo">
                <img src="{{ url_for('static', filename='favicon.ico') }}" alt="Logo">
                <h1>{{ traducoes('site_header') }}</h1>
            </div>

            <nav>
                <a href="{{ url_for('change_language', lang='pt') }}">pt/PT</a>
                <a href="{{ url_for('change_language', lang='en') }}">gb/EN</a>
                <a href="{{ url_for('index') }}">{{ traducoes('my_memories') }}</a>
                <a href="{{ url_for('adicionar') }}">{{ traducoes('new_memory') }}</a>
                <a href="{{ url_for('logout') }}" style="color: #ff9999;">{{ traducoes('leave') }}</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
