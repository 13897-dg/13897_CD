<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>{{ traducoes('login') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/estilo.css') }}">
</head>
<body style="background-color: #e9ecef; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">

    <div style="position: absolute; top: 15px; right: 20px; font-family: sans-serif; font-size: 14px;">
        <a href="{{ url_for('change_language', lang='pt') }}?t={{ range(1, 10000) | random }}" 
           style="text-decoration: none; font-weight: bold; color: {{ '#000' if lang == 'pt' else '#aaa' }};">PT</a> 
        <span style="color: #ccc;">|</span>
        <a href="{{ url_for('change_language', lang='en') }}?t={{ range(1, 10000) | random }}" 
           style="text-decoration: none; font-weight: bold; color: {{ '#000' if lang == 'en' else '#aaa' }};">EN</a>
    </div>

    <div class="form-box" style="margin: 0; width: 100%; max-width: 400px; padding: 40px;">
        
        <h1 style="text-align: center; color: #0056b3; margin: 0 0 10px 0; font-size: 28px;">
            {{ traducoes('site_header') }}
        </h1>
        
        <h2 style="text-align: center; color: #666; font-size: 18px; margin-bottom: 30px; font-weight: normal;">
            {{ traducoes('login') }}
        </h2>
        
        {% if erro %}
            <div style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center; font-size: 0.9em;">
                {{ traducoes(erro) }}
            </div>
        {% endif %}

        <form action="/login" method="POST">
            <label style="font-weight: bold; font-size: 0.9em; color: #333;">{{ traducoes('email') }}</label>
            <input type="email" name="email" required style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px;">

            <label style="font-weight: bold; font-size: 0.9em; color: #333;">{{ traducoes('password') }}</label>
            <input type="password" name="password" required style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 4px;">

            <button type="submit" style="width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">
                {{ traducoes('login') }}
            </button>
        </form>

        <p style="text-align: center; margin-top: 20px; font-size: 0.9em; color: #666;">
            {{ traducoes('no_account') }} <a href="{{ url_for('registo') }}" style="color: #0056b3; text-decoration: none; font-weight: bold;">{{ traducoes('register') }}</a>
        </p>
    </div>

</body>
</html>
