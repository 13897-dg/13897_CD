{% extends "layout.html" %}

{% block content %}
<div class="form-box">
    <h2>{{ traducoes('titulo_form_editar') if memoria else traducoes('titulo_form_nova') }}</h2>
    
    <form name="meuFormulario" 
          action="{{ url_for('editar', id_memoria=memoria.id) if memoria else url_for('adicionar') }}" 
          method="POST" enctype="multipart/form-data"
          onsubmit="return ValidarDados()">
        
        <label>{{ traducoes('lbl_titulo') }}</label>
        <input type="text" name="titulo" value="{{ memoria.titulo if memoria else '' }}">

        <label>{{ traducoes('lbl_descricao') }}</label>
        <textarea name="descricao" rows="4">{{ memoria.descricao if memoria else '' }}</textarea>

        <label>{{ traducoes('lbl_tipo') }}</label>
        <select name="tipo" id="campoTipo">
            <option value="imagem" {{ 'selected' if memoria and memoria.tipo == 'imagem' else '' }}>{{ traducoes('op_foto') }}</option>
            <option value="video" {{ 'selected' if memoria and memoria.tipo == 'video' else '' }}>{{ traducoes('op_video') }}</option>
            <option value="audio" {{ 'selected' if memoria and memoria.tipo == 'audio' else '' }}>{{ traducoes('op_audio') }}</option>
        </select>

        <label>{{ traducoes('lbl_ficheiro') }}</label>
        {% if memoria and memoria.ficheiro %}
            <p style="font-size: 0.8em; color: #666;">Atual: {{ memoria.ficheiro }}</p>
        {% endif %}
        <input type="file" name="ficheiro" id="campoFicheiro">

        <hr>
        <h3>{{ traducoes('lbl_localizacao') }}</h3>
        <label>{{ traducoes('lbl_lat') }}</label>
        <input type="text" name="latitude" value="{{ memoria.lat if memoria else '' }}">
        <label>{{ traducoes('lbl_lon') }}</label>
        <input type="text" name="longitude" value="{{ memoria.lon if memoria else '' }}">

        <button type="submit">{{ traducoes('btn_guardar') }}</button>
    </form>
</div>

<script type="text/javascript">
    function ValidarDados() {
        var form = document.forms["meuFormulario"];
        var titulo = form["titulo"].value;
        var lat = form["latitude"].value;
        var lon = form["longitude"].value;
        var ficheiroInput = document.getElementById("campoFicheiro");
        var tipo = document.getElementById("campoTipo").value;

        // validar campos obrigatorios
        if (titulo == "") {
            alert("O título é obrigatório."); 
            return false;
        }
        if (lat == "" || lon == "") {
            alert("As coordenadas são obrigatórias.");
            return false;
        }

        // validar extensoes
        if (ficheiroInput.files.length > 0) {
            var nome = ficheiroInput.files[0].name.toLowerCase();
            
            if (tipo == "imagem") {
                if (nome.indexOf(".jpg") == -1 && nome.indexOf(".png") == -1) {
                    alert("Para imagem, escolha ficheiros .jpg ou .png");
                    return false;
                }
            }
            else if (tipo == "video") {
                if (nome.indexOf(".mp4") == -1) {
                    alert("Para vídeo, escolha ficheiros .mp4");
                    return false;
                }
            }
            else if (tipo == "audio") {
                if (nome.indexOf(".mp3") == -1 && nome.indexOf(".wav") == -1) {
                    alert("Para áudio, escolha ficheiros .mp3 ou .wav");
                    return false;
                }
            }
        }
        
        return true;
    }
</script>
{% endblock %}
